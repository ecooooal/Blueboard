<header hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        class="md:flex items-center justify-between [&>*]:px-8 bg-primary h-20 text-white sticky top-0 z-40">
    <div class="flex items-center justify-between h-20">
        <logo>
            <a class="flex items-center gap-1" href="/">
                <span class="text-lg text-white font-bold">BLUEBOARD</span>
            </a>
        </logo>
    </div>
    {% if user.is_authenticated %}
    <div class="flex flex-row">
        <a class="flex items-center text-tertiary gap-1 " href="{% url 'profile' %}">
            <span class="text-base font-bold">My Profile</span>
        </a>
        <a class="flex items-center gap-1 "
            hx-get="{% url 'account_logout' %}"
            hx-trigger="click"
            hx-target="#modalContent"
            hx-swap="innerHTML">
            <button data-modal-target="loginModal"
                    data-modal-toggle="loginModal"
                    class="block text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                    Log out
            </button>
        </a>
    </div>
    {% else %}
        <div class="flex flex-row">
        <a class="flex items-center gap-1 mr-16"
            hx-get="{% url 'login' %}"
            hx-trigger="click"
            hx-target="#modalContent"
            hx-swap="innerHTML">
                <button data-modal-target="loginModal"
                        data-modal-toggle="loginModal"
                        class="block text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800" type="button">
                        Log out
                </button>
        </a>
            <a class="flex items-center text-tertiary gap-1" href="/">
                <span class="text-base font-bold">Sign Up</span>
            </a>
        </div>
    {% endif %}
</header>

<div id="loginModal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-2xl max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                    Can only use PCU linked Account
                </h3>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="default-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <div id="modalContent" class="p-4 md:p-5 space-y-4">
            </div>
        </div>
    </div>
</div>
