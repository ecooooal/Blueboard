<header hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        class="flex items-center justify-between [&>*]:px-8 bg-primary h-20 text-white sticky top-0 z-40">
    <logo-container class="flex items-center justify-between h-20">
        <logo>
            <a class="flex items-center gap-2" href="/">
                <span>(Logo Here)</span>
                <div class="flex">
                <span class="text-lg text-white font-bold">BLUE</span>
                <span class="text-lg text-white font-bold">BOARD</span>
                </div>
            </a>
        </logo>
    </logo-container>
    {% if user.is_authenticated %}
    <user-container class="flex gap-5">
        <a class="items-center font-medium rounded-lg text-sm text-center text-tertiary"
           href="{% url 'profile' %}">
            My Profile
        </a>
        <a class="items-center font-medium rounded-lg text-sm  text-center"
            hx-get="{% url 'account_logout' %}"
            hx-trigger="click"
            hx-target="#modalContent"
            hx-swap="innerHTML"
            data-modal-target="loginModal"
            data-modal-toggle="loginModal">
            Log out
        </a>
    </user-container>
    {% else %}
    <user-container class="flex gap-5">
        <a class="items-center font-medium rounded-lg text-sm  text-center"
            hx-get="{% url 'login' %}"
            hx-trigger="click"
            hx-target="#modalContent"
            hx-swap="innerHTML"
            data-modal-target="loginModal"
            data-modal-toggle="loginModal">
            Log in
        </a>
        <a class="items-center font-medium rounded-lg text-sm text-center text-tertiary" href="/">
            Sign Up
        </a>
    </user-container>
    {% endif %}
</header>

<login-modal id="loginModal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div id="modalBody" class="relative p-4 w-full max-w-2xl max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                    Can only use PCU linked Account
                </h3>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="default-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <div id="modalContent" class="p-4 md:p-5 space-y-4">
            </div>
        </div>
    </div>
</login-modal>
