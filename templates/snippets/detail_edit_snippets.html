<form action="{% url 'profile_detail_edit' %}" method="post">
    {% csrf_token %}
    <div class="flex">
        <div class="flex gap-5">
            {{ form }}
        </div>
        <div class="ml-auto">
            <button class="text-blue-700 hover:text-white border border-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2 dark:border-blue-500 dark:text-blue-500 dark:hover:text-white dark:hover:bg-blue-500 dark:focus:ring-blue-800"
                    type="submit">Update</button>
            <a class="text-gray-500 hover:text-white border border-gray-400 hover:bg-gray-500 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2 dark:border-gray-600 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-800"" href="{{ request.META.HTTP_REFERER }}">Cancel</a>
        </div>
    </div>

</form>
