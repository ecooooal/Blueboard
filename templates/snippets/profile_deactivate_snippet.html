
<div class="relative bg-white rounded-lg w-full h-full shadow-lg dark:bg-gray-700">
    <div class="p-4 md:p-5 text-center flex flex-col">
      <svg class="mx-auto mb-4 text-red-700 w-12 h-12 dark:text-red-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
      </svg>
      <div class="flex flex-col my-4">
        <h3 class="mb-3 text-lg font-normal text-red-600 dark:text-red-400">Are you sure you want to DEACTIVATE this Account?</h3>
        <h6 class="text-xs text-gray-500 dark:text-gray-300 self-center">Please request through the office for account REACTIVATION.</h6>
      </div>
    <div class="flex mx-auto gap-5">
      <form action="{% url 'profile_deactivate' %}" method="POST">
            {% csrf_token %}
        <button type="submit" class="text-white bg-red-600 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 dark:focus:ring-red-800 font-medium rounded-lg text-sm inline-flex items-center px-5 py-2.5 text-center">
          DEACTIVATE
        </button>
      </form>
      <a class="text-gray-500 hover:text-white border border-gray-400 hover:bg-gray-500 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2 dark:border-gray-600 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-800" href="{{ request.META.HTTP_REFERER }}">CANCEL</a>
    </div>
  </div>
</div>
