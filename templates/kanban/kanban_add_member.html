<form class="max-w-sm mx-auto"
     method="POST"
     action="{% url 'add_member' kanban.uuid %}"
     >
   {% csrf_token %}
  <div class="flex">
    <input id="username" name="username" type="text" id="website-admin" class="rounded-s-md text-xs  bg-gray-50 border border-gray-300 text-gray-900 focus:ring-blue-500 focus:border-blue-500 block flex-1 min-w-0 w-full text-sm px-4 py-3  mb-3 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Use PCU Email">
  <button
    type="submit"
    class="text-tertiaryOrange bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-small text-xs px-4 py-3 me-3 mb-3 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">
   Add Profiles
   </button>
  </div>
</form>
