<div id="thisBody" class="flex  bg-white rounded-lg w-full h-full shadow-lg dark:bg-gray-700">
    <div class="flex flex-col mx-auto gap-5">
        <login_error class="mt-4">
            {% if form.errors %}
                {% for field, errors in form.errors.items %}
                    {% for error in errors %}
                        <div class="font-bold text-2xl flex mt-2 justify-center text-red-500">
                            {{ error }}  <!-- Display each error message -->
                        </div>
                    {% endfor %}
                {% endfor %}
            {% endif %}
        </login_error>
        <form method="POST" hx-post="{% url 'kanban_edit' kanban.uuid %}" hx-push-url="/kanban/page/{{ kanban.uuid }}" class="p-4 md:p-5">
            {% csrf_token %}
            <div class="grid gap-4 mb-5 grid-cols-2">
                <div class="col-span-2">
                    <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{ form.title.label_tag }}</label>
                    {{ form.title }}
                </div>
                <div class="flex col-span-2">
                    <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{ form.is_public.label_tag }}</label>
                    {{ form.is_public }}
                </div>
            </div>
            <div class="flex gap-2">
            <button type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path></svg>
                Edit Kanban
            </button>
             <a class="text-gray-500 hover:text-white border border-gray-400 hover:bg-gray-500 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center  dark:border-gray-600 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-800" href="{{ request.META.HTTP_REFERER }}">CANCEL</a>
            </div>
        </form>
    </div>
  </div>
</div>
