<!-- Main modal -->
<div id="boardModal" class="flex flex-col p-4 w-full max-w-4xl max-h-full">
    <!-- Modal content -->
    <div id="boardContent" class="flex flex-col h-4/5 h-1/2 w-full bg-white rounded-lg shadow dark:bg-gray-700">
        <!-- Modal header -->
        <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
            <h3 class="text-2xl font-semibold text-gray-900 dark:text-white">
                {{ card.title }}
            </h3>
            <a href="{{ request.META.HTTP_REFFERER }}" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="crud-modal">
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                </svg>
                <span class="sr-only">Close modal</span>
            </a>
        </div>
        <div class="flex flex-col pd-16">
          <div class="flex flex-col pd-16 m-4 ">
            <div class="text-2xl font-bold text-blue-400 mb-4">Description : </div>
            <div class="text-xl font-semibold text-gray-900 mb-4 text-center"><h1>{{ card.description }}</h1></div>
          </div>
          <div class="flex pd-16 m-4 ">
            <h1> <span class="text-red-400 text-base font-bold">Due Date :</span> <span class="text-red-400 text-base font-semibold">{{ card.due_date }}</span> </h1>
            <h1 class="ml-auto "> <span class="text-base font-bold text-blue-400">Author :</span> <span class="text-gray-600 font-semibold">{{ card.created_by }}</span> </h1>
          </div>
        </div>
    </div>
</div>
